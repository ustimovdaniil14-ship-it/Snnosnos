services:
  - type: web
    name: telegram-complaint-helper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/complaints_bot.db
