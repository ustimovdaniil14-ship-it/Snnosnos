services:
  - type: web
    name: telegram-complaint-helper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_complaint_helper_fixed.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
